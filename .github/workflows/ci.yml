name: CI

# A standalone copy of the jobs the shared chain (UAMS-Web/uams-ci-workflows) runs for a
# WordPress plugin, plus the WordPress integration matrix the chain leaves to the caller.
#
# Why not `uses: UAMS-Web/uams-ci-workflows/.github/workflows/ci.yml@<tag>` yet: the shared
# chain's synced-files, no-emoji, aggregate-needs and pest jobs run scripts from the
# `.claude/skills/` tree that the UAMS-Web/uams-claude-skills sync delivers, and this repository
# is not in that sync yet. Once it is, replace the jobs below up to `integration` with the
# shared call (the code-quality skill's ci.yml template, WordPress plugin example: linux-only,
# mutate false, floor-lint, download-archive, phpcs, pest-command `composer test:unit`) and keep
# `integration` and `CI` here.
#
# The last job, `CI`, is the one check a ruleset requires from this workflow. It needs every
# other job, runs `if: always()`, and fails unless each succeeded. Add every new job to its
# `needs:` in the same change, or the new job gates nothing.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The WordPress minor the sites run; tests/Integration/composer.json pins wp-phpunit to it.
  WP_VERSION: '7.1'

jobs:
  composer-validate:
    name: Composer validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: composer validate --no-check-publish
      - run: composer validate --no-check-publish --working-dir=tests/Integration

  pint:
    name: Pint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: composer test:pint

  rector:
    name: Rector
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: composer test:refactor

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # phpstan.neon.dist scans wp-phpunit's classes from the Integration setup.
      - run: composer setup:integration --no-interaction --no-progress
      - run: composer stan

  phpcs:
    name: phpcs (WordPress security sniffs)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: composer test:phpcs

  floor-lint:
    name: Floor lint (PHP 8.2)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: none
      # Every shipped PHP file parses on the supported floor. tests/ runs only on the
      # development PHP and may use its syntax.
      - name: php -l on the shipped files
        run: |
          set -euo pipefail
          files=$(git ls-files '*.php' ':!:tests/**')
          count=$(printf '%s\n' "$files" | grep -c . || true)
          echo "Linting $count file(s) on $(php -r 'echo PHP_VERSION;')"
          if [ "$count" -eq 0 ]; then echo "::error::No PHP files found to lint"; exit 1; fi
          printf '%s\n' "$files" | while read -r f; do php -l "$f"; done

  download-archive:
    name: Download archive
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check that the download holds only what the plugin runs
        run: node scripts/check-download-archive.mjs

  unit:
    name: Unit (Pest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: composer test:unit

  integration:
    name: Integration (WordPress ${{ matrix.wp-version-label }}, ${{ matrix.multisite == '1' && 'multisite' || 'single site' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        multisite: ['0', '1']
        wp-version-label: ['7.1']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bis_regenerate_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      WP_TESTS_ABSPATH: ${{ github.workspace }}/../wordpress
      WP_TESTS_DB_NAME: bis_regenerate_tests
      WP_TESTS_DB_USER: root
      WP_TESTS_DB_PASSWORD: root
      WP_TESTS_DB_HOST: 127.0.0.1:3306
      WP_MULTISITE: ${{ matrix.multisite }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: composer setup:integration --no-interaction --no-progress

      - name: Download WordPress ${{ env.WP_VERSION }}
        run: |
          set -euo pipefail
          curl -sSfL "https://wordpress.org/wordpress-${WP_VERSION}.tar.gz" -o /tmp/wordpress.tar.gz
          mkdir -p "$WP_TESTS_ABSPATH"
          tar -xzf /tmp/wordpress.tar.gz -C "$WP_TESTS_ABSPATH" --strip-components=1
          test -f "$WP_TESTS_ABSPATH/wp-settings.php"
          grep -n "wp_version = " "$WP_TESTS_ABSPATH/wp-includes/version.php"

      - run: composer test:integration

  ci:
    name: CI
    needs: [composer-validate, pint, rector, phpstan, phpcs, floor-lint, download-archive, unit, integration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `skipped` and `cancelled` fail as well as `failure`: a job that did not run proved nothing.
      - name: Every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Needed job results: $RESULTS"
          if [ -z "$RESULTS" ]; then echo "::error::No needed job results to read"; exit 1; fi
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A needed job reported $result"
              exit 1
            fi
          done
